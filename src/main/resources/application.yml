spring:
  application:
    name: ticket-tracker
  datasource:
    url: jdbc:postgresql://localhost:5432/ticket_tracker
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  profiles:
    active: dev
  jpa:
    hibernate:
      ddl-auto: validate

logging:
  config: classpath:logback-spring.xml
  level:
    com.example.skeleton: INFO
    org.hibernate.SQL: WARN

app:
  environment: ${SPRING_PROFILES_ACTIVE:local}
  logging:
    file-path: ${LOG_PATH:logs}
    file-name: ${LOG_FILE_NAME:ticket-tracker}
    archive-path: ${LOG_ARCHIVE_PATH:logs/archive}
    max-file-size: ${LOG_MAX_FILE_SIZE:100MB}
    max-history: ${LOG_MAX_HISTORY:30}
    total-size-cap: ${LOG_TOTAL_SIZE_CAP:1GB}
    slow-threshold-ms: ${SLOW_THRESHOLD_MS:500}

jwt:
  secret: ${JWT_SECRET:50fdf95fdc9b99e425f76a0cfe5d8698fbe89f1fc24bc22d9b464cb698818c62}
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}


security:
  dev-mode: false
  paths-to-skip:
    - /api/auth/**
    - /actuator/**
    - /swagger-ui.html
    - /swagger-ui/**
    - /v3/api-docs/**
  role-paths:
    ADMIN:
      - /api/**
    PROJECT_MANAGER:
      - /api/v1/projects/**
      - /api/v1/tickets/**
    MEMBER:
      - /api/v1/tickets/**
      - /api/v1/tickets/*/comments/**

server:
  port: 8080