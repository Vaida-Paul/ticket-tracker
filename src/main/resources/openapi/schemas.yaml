TicketStatus:
  type: string
  enum:
    - OPEN
    - IN_PROGRESS
    - DONE
    - CANCELLED

Priority:
  type: string
  enum:
    - LOW
    - MEDIUM
    - HIGH
    - URGENT

UserDto:
  type: object
  properties:
    id:
      type: integer
      format: int64
    email:
      type: string
    fullName:
      type: string
    role:
      $ref: 'schemas.yaml#/Role'
  required:
    - id
    - email
    - fullName

ProjectDto:
  type: object
  properties:
    id:
      type: integer
      format: int64
    name:
      type: string
    description:
      type: string
    createdBy:
      $ref: '#/UserDto'
    createdAt:
      type: string
      format: date-time
  required:
    - id
    - name
    - createdBy

ProjectCreateRequest:
  type: object
  properties:
    name:
      type: string
      x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "must not be blank") @jakarta.validation.constraints.Size(min = 1, max = 255, message = "size must be between 1 and 255")'
    description:
      type: string
      x-field-extra-annotation: '@jakarta.validation.constraints.Size(max = 2000, message = "size must be at most 2000")'
  required:
    - name
    - createdById

TicketDto:
  type: object
  properties:
    id:
      type: integer
      format: int64
    title:
      type: string
    description:
      type: string
    status:
      $ref: '#/TicketStatus'
    priority:
      $ref: '#/Priority'
    projectId:
      type: integer
      format: int64
    assigneeId:
      type: integer
      format: int64
    dueDate:
      type: string
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
  required:
    - id
    - title
    - status
    - priority
    - projectId

TicketCreateRequest:
  type: object
  properties:
    title:
      type: string
      x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "must not be blank") @jakarta.validation.constraints.Size(min = 1, max = 255, message = "size must be between 1 and 255")'
    description:
      type: string
      x-field-extra-annotation: '@jakarta.validation.constraints.Size(max = 2000, message = "size must be at most 2000")'
    status:
      $ref: '#/TicketStatus'
      default: OPEN
    priority:
      $ref: '#/Priority'
    projectId:
      type: integer
      format: int64
      x-field-extra-annotation: '@jakarta.validation.constraints.NotNull(message = "must not be null") @jakarta.validation.constraints.Min(value = 1, message = "must be greater than or equal to 1")'
    assigneeId:
      type: integer
      format: int64
    dueDate:
      type: string
      format: date-time
  required:
    - title
    - priority
    - projectId

TicketPatchRequest:
  type: object
  properties:
    title:
      type: string
    description:
      type: string
      nullable: true
    status:
      $ref: '#/TicketStatus'
    priority:
      $ref: '#/Priority'
    assigneeId:
      type: integer
      format: int64
      nullable: true
    dueDate:
      type: string
      format: date-time
      nullable: true

TicketPutRequest:
  type: object
  properties:
    title:
      type: string
      x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "must not be blank") @jakarta.validation.constraints.Size(min = 1, max = 255, message = "size must be between 1 and 255")'
    description:
      type: string
      x-field-extra-annotation: '@jakarta.validation.constraints.Size(max = 2000, message = "size must be at most 2000")'
    status:
      $ref: '#/TicketStatus'
    priority:
      $ref: '#/Priority'
    assigneeId:
      type: integer
      format: int64
    dueDate:
      type: string
      format: date-time
  required:
    - title
    - status
    - priority

CommentDto:
  type: object
  properties:
    id:
      type: integer
      format: int64
    body:
      type: string
    authorId:
      type: integer
      format: int64
    ticketId:
      type: integer
      format: int64
    createdAt:
      type: string
      format: date-time
  required:
    - id
    - body
    - authorId
    - ticketId

CommentCreateRequest:
  type: object
  properties:
    body:
      type: string
      x-field-extra-annotation: '@jakarta.validation.constraints.NotBlank(message = "must not be blank") @jakarta.validation.constraints.Size(min = 1, max = 1000, message = "size must be between 1 and 1000")'
  required:
    - body

PageResponseTicketDto:
  type: object
  properties:
    content:
      type: array
      items:
        $ref: '#/TicketDto'
    page:
      type: integer
      format: int32
    size:
      type: integer
      format: int32
    totalPages:
      type: integer
      format: int32
    totalElements:
      type: integer
      format: int64
  required:
    - content
    - page
    - size
    - totalPages
    - totalElements
TicketSearchRequest:
  type: object
  properties:
    status:
      $ref: '#/TicketStatus'
    priority:
      $ref: '#/Priority'
    assigneeId:
      type: integer
      format: int64
    dueBefore:
      type: string
      format: date
    dueAfter:
      type: string
      format: date
    titleContains:
      type: string

ErrorResponse:
  type: object
  properties:
    timestamp:
      type: string
      format: date-time
    status:
      type: integer
    error:
      type: string
    message:
      type: string
    path:
      type: string
  required:
    - timestamp
    - status
    - error
    - message

PageResponseProjectDto:
  type: object
  properties:
    content:
      type: array
      items:
        $ref: '#/ProjectDto'
    page:
      type: integer
      format: int32
    size:
      type: integer
      format: int32
    totalPages:
      type: integer
      format: int32
    totalElements:
      type: integer
      format: int64
  required:
    - content
    - page
    - size
    - totalPages
    - totalElements

RegisterRequest:
  type: object
  required: [email, password, fullName]
  properties:
    email:
      type: string
      format: email
      x-field-extra-annotation: "@jakarta.validation.constraints.Email(message = \"must be a valid email\")"
    password:
      type: string
      minLength: 8
      maxLength: 100
      x-field-extra-annotation: "@jakarta.validation.constraints.Size(min = 8, max = 100, message = \"size must be between 8 and 100\")"
    fullName:
      type: string
      minLength: 1
      maxLength: 255
      x-field-extra-annotation: "@jakarta.validation.constraints.NotBlank(message = \"must not be blank\") @jakarta.validation.constraints.Size(min = 1, max = 255, message = \"size must be between 1 and 255\")"

LoginRequest:
  type: object
  required: [email, password]
  properties:
    email:
      type: string
      format: email
      x-field-extra-annotation: "@jakarta.validation.constraints.Email(message = \"must be a valid email\")"
    password:
      type: string
      x-field-extra-annotation: "@jakarta.validation.constraints.NotBlank(message = \"must not be blank\")"

AuthResponse:
  type: object
  required: [accessToken, refreshToken, expiresIn]
  properties:
    accessToken:
      type: string
    refreshToken:
      type: string
    expiresIn:
      type: integer
      format: int64
      description: Access token lifetime in seconds

RefreshRequest:
  type: object
  required: [refreshToken]
  properties:
    refreshToken:
      type: string

Role:
  type: string
  enum: [ ADMIN, PROJECT_MANAGER, MEMBER ]