services:
  postgres:
    image: postgres:16-alpine
    container_name: ticket-tracker-db
    environment:
      POSTGRES_DB: ticket_tracker
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ticket_tracker"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - ticket-tracker-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: ticket-tracker-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:8025/livez" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - ticket-tracker-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ticket-tracker-app
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      SECURITY_DEV_MODE: "false"
      DB_URL: jdbc:postgresql://postgres:5432/ticket_tracker
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_EXPIRATION_MS: ${JWT_ACCESS_EXPIRATION_MS:-900000}
      JWT_REFRESH_EXPIRATION_MS: ${JWT_REFRESH_EXPIRATION_MS:-604800000}
      MAIL_HOST: mailpit
      MAIL_PORT: 1025
    ports:
      - "8080:8080"
    networks:
      - ticket-tracker-net

volumes:
  postgres_data:
    name: ticket-tracker-postgres-data

networks:
  ticket-tracker-net:
    name: ticket-tracker-net